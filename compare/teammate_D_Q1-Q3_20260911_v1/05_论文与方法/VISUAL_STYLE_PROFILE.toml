profile_name = "CUMCM scientific muted accessible"
version = "2026-09-11"
status = "accepted-for-current-draft"
basis = "Reviewed SEM reference packs plus public Nature/Science figure guidance; not a journal-branded template."
paper_width_mm = 155
font_family_policy = "Installed Chinese font selected by src.visualization.style; PDF embeds TrueType; SVG keeps text elements editable."

[colors]
ink = "#263238"
muted = "#697780"
grid = "#D9E1E5"
primary = "#3B6686"
secondary = "#8195A3"
adjust = "#2A8278"
revoke = "#B95C50"
accent = "#C17B3A"
keep = "#9AABB5"
pale_primary = "#EDF3F6"
pale_teal = "#EAF4F1"
pale_accent = "#F7F0E8"
pale_warning = "#F8ECEA"

[semantics]
primary = "主模型或主要证据"
secondary = "基线或低显著度背景"
adjust = "调整/改进状态"
revoke = "撤销或需要警示的状态"
accent = "对照方案或关键类别"
keep = "保留状态"

[export]
formats = ["pdf", "svg", "png"]
png_dpi = 400
grayscale_preview = true
vector_text = "editable-svg-and-embedded-true-type-pdf"

[layout]
background = "white"
internal_titles = "short-left-aligned"
grid = "light-axis-only"
legend = "only-when-direct-labels-are-insufficient"
avoid = ["rainbow", "3d", "decorative-icons", "large-screen-only-canvas", "color-only-categories"]

[decision_log]
accepted = [
  "Use one focal claim per figure and let the paper caption carry context.",
  "Use position, labels, or line/marker redundancy with color.",
  "Render at final paper size and inspect color plus grayscale.",
  "Use SVG/PDF as vector delivery and PNG only as a preview/QA artifact."
]
rejected = [
  "Directly copying the SEM simulated CSV values or business assumptions.",
  "Using the SEM template pack as a data/model interface.",
  "Treating Nature/Science visual guidance as official CUMCM rules."
]
