visual_id = "fig_q1_conflict_structure"
kind = "chart"
schema_version = 1
contract_mode = "descriptive"
status = "REVISED_PREVIEW"
purpose = "展示冲突装备对的类别结构，并为 Q2 的耦合消解提供定位依据"
claim = "297 对冲突中 B-C 占 181 对，且按全部可能 B-C 配对归一化后的冲突率 5.03% 仍为最高"

[evidence]
files = ["outputs/q1/conflict_pairs.csv", "outputs/q1/plot_data/conflict_counts_by_category.csv", "outputs/q1/plot_data/degree_by_plan.csv"]
fields = ["冲突装备1", "冲突装备2", "类别组合", "冲突对数", "可配对数", "冲突率"]
filters = "每个无序装备对只计一次；事件级重复重叠不在图中重复计数"
units = "右图横轴：百分比；条末：冲突对数/可配对数"

[meaning]
chart_family = "pairwise adjacency matrix + normalized horizontal bar"
x = "冲突装备类别"
y = "冲突装备类别 / 类别组合"
aggregation = "无序装备对去重；按类别组合归一化"
uncertainty = "none，确定性完整枚举"
scale = "linear"

[appearance]
width_mm = 155
height_mm = 92
palette_profile = "project:VISUAL_STYLE_PROFILE.toml"
primary_color = "#3B6686"
accent_color = "#C17B3A"
grid = "x_only_light"
direct_labels = true
grayscale_redundancy = "B-C uses darker tone and direct label"

[labels]
xlabel = "冲突装备的类别"
ylabel = "冲突装备的类别"
caption = "左图为按类别排序的冲突邻接结构；右图为类别组合冲突率，条末为冲突对数/可配对数。"

[delivery]
source = "scripts/plot_q1_conflicts.py"
formats = ["pdf", "svg", "png"]
png_dpi = 400
svg_text = "text-elements"
paper_width_mm = 155

[[revision.changes]]
version = 2
type = "visual-redesign"
summary = "由 imshow 稀疏矩阵改为可缩放散点矩阵；统一低饱和主题；减少标题和装饰；增加可读的百分比与分母标签；新增 SVG。"
