final_review:
  personas:
    - id: A
      name: 数学建模专家
      scope: 问题抽象/优化模型/模型必要性/结论匹配度
    - id: B
      name: 统计与机器学习审稿人
      scope: independence/repeated measures/censoring/leakage/bias/threshold selection/CI/overfitting
    - id: C
      name: 科学编辑与视觉审稿人
      scope: 摘要/图/表/标粗/视觉层级/30秒可理解; page composition（orphan spill/recoverable underfill/float placement/first-reference proximity）
  veto:
    - "Reviewer B critical: leakage / wrong likelihood / invalid censoring / invalid test protocol"
    - "Reviewer C submission blocker: figure blank / table clipped / unresolved reference / orphan spill / near-empty continuation page / isolated heading或caption / broken abstract-keywords"
  pass_rule: "总分 ≥70 且核心维度（建模求解、结果检验）≥该维满分50%，其余维度≥40%"

# v4.3：机器可读控制面——工作流依赖 verdict 字段驱动，禁止自然语言"建议考虑"式回滚
control_plane:
  verdicts: ["PASS", "WARN", "BLOCKER", "CRITICAL"]
  failure_events: "reports/methodology/failure_events.json"
  failure_events_schema:
    code: string          # 如 PARSIMONY_PRIMARY_LOST
    severity: "blocker | critical"
    invalidate: ["<result key / model id>"]
    return_to: string     # 如 methodology_review / coding_visual
    validation_verdict: "FAIL | UNKNOWN | ERROR"
    failure_class: "model_invalid | implementation_error | data_invalid | budget_exhausted | criterion_invalid | missing_evidence"
    resolution_mode: "replace_model | repair_code | repair_data | run_missing_evidence | fix_criterion | drop_claim"
    source_artifact_revisions: {"<workspace-relative path>": "sha256"}
    evidence_refs: ["<validation/result/artifact ref>"]
    status: "open | resolved"
    resolved_at: string   # status=resolved 时必填
  rules:
    - "任一 failure.event severity∈{blocker,critical} 且 status=open -> 最终验收 BLOCKER（methodology gate FAIL）"
    - "典型触发：assumption failed / family selection leakage / model has no practical gain / optimization degenerates / simpler model dominates / calibration failed but probability wording required / result contradicts core hypothesis"
    - "不能让 Agent 为『把原计划写圆』而继续推向论文阶段：failure event 的 return_to 即机器化回滚目标阶段"
    - "Result Review v2 的 failure_class/resolution_mode/return_to 必须继承预注册 VALIDATION_PLAN 与 VALIDATION_EVAL；不得在结果出来后改 criterion、降阈值或重标 failure_class"
    - "V7-P0-06（Intake Authority v3）：authority 只有六态 primary_official/verified_legacy/unverified/conflicting/stale/invalidated，不存在'已有结果=真值'；verified_legacy 仅表示冻结历史证据（frozen=true），可被新 canonical evaluator 冲突失效，无永久真值地位"
    - "V7-P0-06：旧结果与 VALIDATION_EVAL（canonical evaluator）冲突时必须标 conflicting 并保留双方产物，禁止静默覆盖或删除任一方；stale/invalidated 资产不得作为 paper claim 的 authority 输入（RESULT_REGISTRY 交叉校验 FAIL）"
    - "V7-P0-06：禁止通过修改 hash、时间戳、source 标记或 authority 状态掩盖冲突——重算 SHA（T295-T297 语义）+ conflict 台账 conflict_id 对账 + primary_official 仅限 source=official 机器强制"
    - "V7-P0-07（官方规则 authority）：official_rules.json 是硬规范唯一机器来源（每条规则带 source_id/locator 原文位置/verbatim 引文/effective_at，引文逐字对账 mcm.edu.cn 离线快照 SHA——声明不是证明）；style policy 只能引用 rule_id，硬参数回植=覆盖/重新解释 hard rule，rules_doctor FAIL；无法确认的主张只能标 internal/unresolved 进 internal_policies，禁止留在官方 must 集合"
    - "V7-P0-07（R-06 已核实恢复）：论文附录必须含全部完整可运行源码全文（官方第五条），『核心伪代码+ZIP 替代』不是合规路径；ZIP 与论文一致（R-09）是附加义务；AI 声明官方定句以 R-05.hard_value 为准（style policy 内改写定句的旧条款已废除）"
    - "V7-P0-08（benchmark 冻结）：五题 Development Benchmark Suite（BENCHMARK_SUITE_MANIFEST.json，题面/数据/参考论文/五 profile + sha 钉死）在 Phase 1 前冻结，之后不得为迎合新功能更换题目；Sentinel=CUMCM2025-C，baseline=V6 deployed preset 原样 clean-room 运行冻结（身份三锚点：P0-00A 冻结清单逐字节 + dc65b02c lineage + 044f4275≠V6 反例），禁止先修后冻"
    - "V7-P0-08（Sentinel E2E 纪律）：Sentinel run 只能经 tools/run_sentinel_e2e.py prepare→(agent session)→finalize 链执行——空工作区拒绝非空目录、题面/数据 sha 漂移拒绝、产物命中禁读资产哈希或路径引用即 FAIL、prepare 前已存在文件即跨 run 污染 FAIL、preset staging 篡改 FAIL；runner 永不生成论文内容（运行编排是 Agent 运行时行为，伪造 run 产物禁止）；Phase 对比只能 tools/phase_audit.py 一条命令出 before/after 报告"

